<!doctype html>
<title>Leave guard (prop)</title>
<body>
<button id="touch">Touch</button>
<script>
  window.__log = [];
  document.querySelector("#touch").addEventListener("click", (e) => window.__log.push(`touch trusted=${e.isTrusted}`));
  function ran(name) { sessionStorage.setItem("unloadHandlers", (sessionStorage.getItem("unloadHandlers") ?? "") + name + " "); }
  document.body.onbeforeunload = () => { ran('body property'); return 'unsaved'; };
</script>
</body>
