<!doctype html><html><head><meta charset="utf-8"><title>Overlay</title></head>
<body>
<main><h1>Page under the overlay</h1><button>Behind</button><p>Text of the page.</p></main>
<div id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center">
  <div style="background:#fff;padding:20px;width:300px;height:150px"><p>We use cookies</p><button onclick="document.getElementById('overlay').remove()">Accept all</button></div>
</div>
</body></html>
