<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture page</title>
<style>
  body { font-family: sans-serif; }
  .fake { display: inline-block; padding: 6px; background: #eee; cursor: pointer; }
  #cover { position: relative; display: inline-block; }
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,.1); }
  #hovermenu .item { display: none; } #hovermenu:hover .item { display: block; }
  #jsmenu .item { display: none; } #jsmenu.open .item { display: block; }
</style></head>
<body>
  <h1>Fixture page</h1>
  <button id="native">Native button</button>
  <div class="fake" id="fake">Open conversation</div>
  <label>Name <input id="name"></label>
  <label>Tracked <input id="tracked"></label>
  <div id="editor" contenteditable="true" aria-label="Editor" style="border:1px solid #999;min-height:20px"></div>
  <button id="disabled" disabled>Disabled button</button>
  <span id="cover"><button id="covered">Covered button</button><span id="overlay"></span></span>
  <button id="ask">Ask</button>
  <button id="popup">Open popup</button>
  <button id="trustedonly">Trusted only</button>
  <a id="link" href="other.html">Go to other</a>
  <a id="blank" href="other.html" target="_blank">Other in new tab</a>
  <div id="hovermenu">CSS menu<div class="item">CSS item</div></div>
  <div id="jsmenu">JS menu<div class="item">JS item</div></div>
  <form id="form"><label>Query <input id="query" name="q"></label></form>
  <label><input type="checkbox" id="agree"> Agree</label>
  <label>Color <select id="color"><option value="r">Red</option><option value="g">Green</option></select></label>
  <label>Upload <input type="file" id="file"></label>
  <ul id="list"></ul>
  <pre id="log"></pre>
<script nonce="fixture">
  window.__log = [];
  const record = (entry) => { window.__log.push(entry); document.getElementById('log').textContent = window.__log.join('\n'); };
  document.getElementById('native').addEventListener('click', (e) => record('native trusted=' + e.isTrusted));
  document.addEventListener('click', (e) => { if (e.target.closest('.fake')) record('fake'); });
  document.getElementById('name').addEventListener('input', (e) => record('name ' + e.target.value));
  document.getElementById('editor').addEventListener('input', (e) => record('editor ' + e.target.textContent));
  document.getElementById('ask').addEventListener('click', () => record('confirm=' + confirm('Delete this?')));
  document.getElementById('popup').addEventListener('click', () => record('popup=' + Boolean(window.open('other.html'))));
  document.getElementById('trustedonly').addEventListener('click', (e) => { if (e.isTrusted) record('trusted click'); });
  document.getElementById('jsmenu').addEventListener('mouseenter', (e) => e.currentTarget.classList.add('open'));
  document.getElementById('form').addEventListener('submit', (e) => { e.preventDefault(); record('submitted ' + document.getElementById('query').value); });
  document.getElementById('file').addEventListener('change', (e) => record('files ' + [...e.target.files].map((f) => f.name + ':' + f.size).join(',')));
  const tracked = document.getElementById('tracked');
  const native = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  let trackerValue = '';
  Object.defineProperty(tracked, 'value', { configurable: true, get() { return native.get.call(this); }, set(v) { trackerValue = String(v); native.set.call(this, v); } });
  tracked.addEventListener('input', () => { const v = native.get.call(tracked); if (v === trackerValue) return; trackerValue = v; record('tracked ' + v); });
  const list = document.getElementById('list');
  for (let i = 1; i <= 50; i++) { const li = document.createElement('li'); li.textContent = 'item ' + i; list.appendChild(li); }
  window.__app = { name: 'fixture-app' };
</script>
</body>
</html>
